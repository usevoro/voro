name: macOS validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run package
      - name: Test packaged app
        run: |
          export ASSET_REVIEWER_EXECUTABLE="$PWD/out/VORO-darwin-$(node -p 'process.arch')/VORO.app/Contents/MacOS/VORO"
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-screenshots
          path: test-results/*.png
